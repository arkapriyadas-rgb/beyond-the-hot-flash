<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyond the Hot Flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#EC3D86; --pink-deep:#C92A6E; --blush:#FCEEF3; --petal:#F7CFDF; --rose:#F48DB5;
  --ink:#3A3237; --muted:#8A7E86; --line:#EFE2E8; --card:#FFFFFF; --page:#FDF4F7;
  --on-pink:#FFFFFF; --sel:#FDE6EF; --shadow:0 10px 30px rgba(201,42,110,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pink:#F0569A; --pink-deep:#E0478A; --blush:#2A1D24; --petal:#5A2E43; --rose:#8E3C62;
    --ink:#F6EAF0; --muted:#C7B3BE; --line:#4A3540; --card:#24191F; --page:#1B1318;
    --on-pink:#FFFFFF; --sel:#3D2230; --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --pink:#F0569A; --pink-deep:#E0478A; --blush:#2A1D24; --petal:#5A2E43; --rose:#8E3C62;
  --ink:#F6EAF0; --muted:#C7B3BE; --line:#4A3540; --card:#24191F; --page:#1B1318;
  --on-pink:#FFFFFF; --sel:#3D2230; --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body[data-lang="bn"]{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:17px}
body[data-lang="hi"]{font-size:16.5px}
button{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:10px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}

/* Floral blur stage */
.stage{position:relative;overflow:hidden;background:linear-gradient(160deg,#F6C6D8 0%,#E98AB0 45%,#D9618F 100%);color:#fff}
.stage .bloom{position:absolute;filter:blur(14px);opacity:.85;pointer-events:none}
.stage .bloom.soft{filter:blur(30px);opacity:.7}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.18),rgba(255,255,255,0) 60%);pointer-events:none}
.stage > .inner{position:relative;z-index:1}

/* Language screen */
.lang-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.lang-screen .inner{width:100%;text-align:center}
.brand{font-weight:500;font-size:1.05rem;letter-spacing:.02em;opacity:.95;margin:0 0 6px}
.hero-title{font-weight:700;font-size:2.4rem;line-height:1.1;margin:0 0 34px;text-shadow:0 2px 18px rgba(120,20,60,.25)}
.lang-label{margin:0 0 14px;font-size:1rem;opacity:.95}
.lang-list{display:grid;gap:12px;max-width:320px;margin:0 auto}
.lang-btn{display:block;width:100%;padding:16px 18px;border-radius:18px;border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:1.2rem;font-weight:600;cursor:pointer;transition:background .15s}
.lang-btn:hover{background:rgba(255,255,255,.34)}
.lang-btn .en{font-family:"Poppins",sans-serif}
.lang-btn .hi{font-family:"Poppins",sans-serif}
.lang-btn .bn{font-family:"Hind Siliguri",sans-serif}

/* Welcome */
.welcome-top{padding:40px 24px 90px;text-align:center}
.welcome-top .hero-title{font-size:2.1rem;margin:4px 0 10px}
.subtitle{margin:0 auto;max-width:300px;font-size:1.02rem;line-height:1.45;opacity:.96}
textarea.othertext{min-height:90px;margin-top:12px}
.panel{background:var(--card);margin:-60px 16px 24px;border-radius:24px;padding:24px 22px;box-shadow:var(--shadow);position:relative;z-index:2}
.panel p{margin:0 0 14px}
.note{font-size:.9rem;color:var(--muted);background:var(--blush);border-radius:14px;padding:12px 14px;margin:0 0 18px}
.consent{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;margin-bottom:18px;background:transparent;width:100%;text-align:left}
.consent[aria-checked="true"]{border-color:var(--pink);background:var(--sel)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card)}
.tick.square{border-radius:8px}
[aria-checked="true"] .tick{background:var(--pink);border-color:var(--pink)}
.tick svg{width:15px;height:15px;opacity:0}
[aria-checked="true"] .tick svg{opacity:1}
.link{background:none;border:none;color:var(--pink-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0;font-size:.95rem}
:root:not([data-theme="light"]) .link{color:var(--pink)}

/* Question screen */
.qhead{background:var(--pink);color:var(--on-pink);padding:14px 18px 70px;border-radius:0 0 28px 28px;position:relative;z-index:3}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.16);display:grid;place-items:center;cursor:pointer;color:#fff}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.apptitle{font-weight:600;font-size:1.15rem;margin:0}
.progress{display:flex;align-items:center;gap:12px}
.track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.fill{height:100%;background:#fff;border-radius:99px;transition:width .3s ease}
.count{font-weight:600;font-size:.95rem;min-width:44px;text-align:right}
.qcard{background:var(--card);margin:-54px 16px 0;border-radius:24px;padding:22px 18px 20px;box-shadow:var(--shadow);position:relative;z-index:4;flex:1}
.sec{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.qtext{font-size:1.55rem;line-height:1.25;font-weight:700;margin:0 0 8px;color:var(--ink)}
body[data-lang="bn"] .qtext,body[data-lang="hi"] .qtext{line-height:1.4}
.hint{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 14px 14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem;line-height:1.35;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--rose)}
.opt[aria-checked="true"]{border-color:var(--pink);background:var(--sel);box-shadow:0 6px 18px rgba(236,61,134,.15)}
.sub{margin-top:24px;padding-top:18px;border-top:1.5px dashed var(--line)}
.subq{font-size:1.1rem;font-weight:600;margin:0 0 4px}
textarea{width:100%;min-height:140px;border-radius:16px;border:1.5px solid var(--line);padding:14px;font:inherit;color:var(--ink);background:var(--card);resize:vertical}
textarea:focus{outline:none;border-color:var(--pink)}
.foot{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--page) 70%,rgba(0,0,0,0));z-index:5}
.btn{display:block;width:100%;padding:16px;border-radius:18px;border:none;background:var(--pink);color:#fff;font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 20px rgba(236,61,134,.28)}
.btn:disabled{background:var(--petal);color:var(--muted);box-shadow:none;cursor:default}
.btn.ghost{background:var(--card);color:var(--pink-deep);border:1.5px solid var(--pink);box-shadow:none;margin-top:10px}
.banner{font-size:.8rem;text-align:center;padding:6px 12px;background:#FFF4D6;color:#6B5200}

/* End screens */
.end{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.endcard{background:var(--card);color:var(--ink);border-radius:26px;padding:28px 22px 26px;text-align:center;box-shadow:0 18px 50px rgba(120,20,60,.25);max-width:380px;width:100%}
.medal{width:118px;height:118px;margin:0 auto 4px;display:block}
.ribbon{display:inline-block;background:var(--petal);color:var(--pink-deep);font-weight:700;font-size:.85rem;padding:5px 16px;border-radius:10px;margin:0 0 14px;border:1.5px solid var(--rose)}
:root:not([data-theme="light"]) .ribbon{color:#fff}
.endtitle{font-size:1.6rem;font-weight:700;line-height:1.2;margin:0 0 10px}
.endbody{margin:0;color:var(--muted)}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.saving{text-align:center;color:#fff;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){.app{padding-top:20px}.qhead{border-radius:28px}.stage.lang-screen,.stage.end{border-radius:0}}
</style>
</head>
<body data-lang="en">
<div class="app" id="app" aria-live="polite"></div>
<script>
const SURVEY = {"version": "v1", "ui": {"appTitle": {"en": "Beyond the Hot Flash", "hi": "हॉट फ़्लैश से आगे", "bn": "হট ফ্ল্যাশের ওপারে"}, "subtitle": {"en": "A 4-minute study of the nights no one talks about.", "hi": "उन रातों पर 4 मिनट की एक स्टडी, जिनके बारे में कोई बात नहीं करता।", "bn": "যে রাতগুলোর কথা কেউ বলে না, তা নিয়ে ৪ মিনিটের একটি সমীক্ষা।"}, "chooseLang": {"en": "Choose your language", "hi": "अपनी भाषा चुनें", "bn": "আপনার ভাষা বেছে নিন"}, "welcomeTitle": {"en": "How are your nights, really?", "hi": "आपकी रातें सच में कैसी होती हैं?", "bn": "আপনার রাতগুলো আসলে কেমন কাটে?"}, "welcomeBody": {"en": "I'm a design student at NIFT Delhi, trying to understand how women in their 40s and 50s experience their nights. It takes 3–5 minutes. I won't ask for your name, phone number or any personal details. You can skip any question you don't want to answer.", "hi": "मैं NIFT दिल्ली की एक डिज़ाइन स्टूडेंट हूँ। मैं समझना चाहती हूँ कि 40 और 50 की उम्र की महिलाओं की रातें कैसी होती हैं। इसमें 3–5 मिनट लगेंगे। मैं आपका नाम, फ़ोन नंबर या कोई निजी जानकारी नहीं पूछूँगी। जिस सवाल का जवाब नहीं देना चाहतीं, उसे छोड़ सकती हैं।", "bn": "আমি NIFT দিল্লির একজন ডিজাইনের ছাত্রী। ৪০ আর ৫০-এর কোঠার মহিলাদের রাত কেমন কাটে, সেটা বুঝতে চাইছি। ৩–৫ মিনিট লাগবে। আপনার নাম, ফোন নম্বর বা কোনও ব্যক্তিগত তথ্য চাওয়া হবে না। যে প্রশ্নের উত্তর দিতে চান না, সেটা ছেড়ে দিতে পারেন।"}, "storageNote": {"en": "Your answers will be stored securely in Google Sheets for research. Anything you write in your own words may be translated into English for analysis.", "hi": "आपके जवाब रिसर्च के लिए Google Sheets में सुरक्षित रखे जाएँगे। अपने शब्दों में लिखे जवाबों का विश्लेषण के लिए अंग्रेज़ी में अनुवाद किया जा सकता है।", "bn": "আপনার উত্তর গবেষণার জন্য Google Sheets-এ সুরক্ষিতভাবে রাখা হবে। নিজের ভাষায় লেখা উত্তর বিশ্লেষণের জন্য ইংরেজিতে অনুবাদ করা হতে পারে।"}, "consent": {"en": "I'm happy to take part.", "hi": "मैं हिस्सा लेने के लिए तैयार हूँ।", "bn": "আমি অংশ নিতে রাজি।"}, "start": {"en": "Start", "hi": "श       if (Q[id].otherText){
        const k = Q[id].otherText;
        p[k] = (!shown || v !== "other") ? "NA" : String(state.answers[k] || "").trim();
      }
    });
    return p;
  }

  function send(){
    if (state.sending) return;
    state.sending = true;
    const payload = buildPayload();
    state.screen = "saving"; render();
    const ok = () => { state.sending = false; state.screen = state.under40 ? "u40" : "done"; render(); };
    const fail = () => { state.sending = false; state.screen = "error"; render(); };
    if (IN_APPS_SCRIPT){
      // text/plain keeps this a "simple" request, so the browser sends it without a CORS pre-check.
      fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" })
        .then(r => r.json())
        .then(r => (r && r.ok) ? ok() : fail())
        .catch(fail);
    } else {
      console.log("Preview payload (not saved):", payload);
      window.__lastPayload = payload;
      setTimeout(ok, 700);
    }
  }

  app.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const act = el.getAttribute("data-act");
    if (act === "lang"){ state.lang = el.getAttribute("data-v"); state.screen = "welcome"; render(); }
    else if (act === "changelang"){ state.screen = "lang"; render(); }
    else if (act === "consent"){ state.consent = !state.consent; render(); }
    else if (act === "start"){ if (state.consent){ state.screen = "q"; state.step = 0; render(); } }
    else if (act === "pick"){ pick(el.getAttribute("data-q"), el.getAttribute("data-v")); }
    else if (act === "back"){ if (state.step > 0){ state.step--; render(); } else { state.screen = "welcome"; render(); } }
    else if (act === "next"){
      const step = visibleSteps()[state.step];
      if (!canProceed(step)) return;
      if (step === "q1_age" && state.answers.q1_age === "u40"){ state.under40 = true; send(); return; }
      state.under40 = false;
      state.step++; render();
    }
    else if (act === "submit"){ send(); }
    else if (act === "retry"){ send(); }
  });
  app.addEventListener("input", e => {
    const el = e.target;
    if (el.getAttribute("data-act") === "text") state.answers[el.getAttribute("data-q")] = el.value;
  });
  render();
})();
</script>
</body>
</html>
